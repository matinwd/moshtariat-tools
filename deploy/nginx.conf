# Static file server for moshtariat-tools. Reached only through the production
# edge proxy at /tools — see deploy/README for the route config.
user nginx;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    sendfile on;
    keepalive_timeout 65;
    # Writable under the read-only rootfs (tmpfs).
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    server {
        listen 8080;
        # Requests keep their /tools prefix (proxy_pass does not rewrite), and
        # the build output lives in /var/www/tools — so root is /var/www.
        root /var/www;
        index index.html;
        absolute_redirect off;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location ~ /\. { return 404; }
        location ^~ /tools/assets/ {
            # Content-hashed directory: immutable forever.
            expires 365d;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location = /tools { return 301 /tools/; }
        location = /tools/ { try_files /tools/index.html =404; }

        # Clean URLs: /tools/vat -> vat.html, with a single 301 for a
        # trailing-slash request so there is one canonical address per tool.
        location ~ ^/tools/([a-z0-9-]+)/$ {
            return 301 /tools/$1;
        }
        location ~ ^/tools/[a-z0-9-]+$ {
            try_files $uri.html $uri =404;
        }

        location /tools/ {
            expires -1;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri.html =404;
        }

        # Health checks and anything else under /tools/… are handled above;
        # a bare hit outside the prefix is not ours.
        location / { return 404; }

        error_page 404 /tools/404.html;
        location = /tools/404.html { internal; }
    }
}
